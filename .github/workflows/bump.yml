name: Bump cask

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify a newer release but change nothing and commit nothing
        type: boolean
        default: false
      reverify_current:
        description: Also re-verify the release the cask already pins (never changes the cask)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  prepare:
    name: Verify the latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the latest release and update the cask
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          REVERIFY_CURRENT: ${{ inputs.reverify_current }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flags=()
          if [[ "$DRY_RUN" == "true" ]]; then
            flags+=(--dry-run)
          fi
          # Scheduled runs also re-check the pinned release, so a swapped release asset is noticed.
          if [[ "$EVENT_NAME" == "schedule" || "$REVERIFY_CURRENT" == "true" ]]; then
            flags+=(--verify-current)
          fi
          python3 scripts/bump_cask.py "${flags[@]}"
      - name: Keep the updated cask
        if: steps.bump.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cask
          path: Casks/cairn.rb
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate (${{ matrix.os }})
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && inputs.dry_run != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cask
          path: Casks
      - name: Validate the updated cask
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci-validate.sh tap

  commit:
    name: Commit the verified bump
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true' && inputs.dry_run != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cask
          path: Casks
      - name: Commit and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cairn.rb
          git commit -m "cairn $VERSION"
          git push origin HEAD:main
